<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Baronix">
  <!-- Baronix: a crowned pint - the baron of the bar. Solid shapes on an
       amber tile so it still reads at 16px in a browser tab. -->
  <rect width="64" height="64" rx="14" fill="#f5a524"/>
  <g fill="#1a1206">
    <!-- Crown -->
    <path d="M19.5 20.5 17 9.5l8 6 7-8.5 7 8.5 8-6-2.5 11z"/>
    <circle cx="17" cy="9.5" r="2"/>
    <circle cx="32" cy="7" r="2"/>
    <circle cx="47" cy="9.5" r="2"/>
    <!-- Pint glass -->
    <path d="M18.5 24h27l-3.2 32H21.7z"/>
  </g>
  <!-- Foam head and a glint on the glass -->
  <path d="M20.6 26.2h22.8l-.55 5.4H21.15z" fill="#fff3d6"/>
  <rect x="25" y="35" width="3" height="16" rx="1.5" fill="#f5a524" opacity=".6"/>
</svg>
