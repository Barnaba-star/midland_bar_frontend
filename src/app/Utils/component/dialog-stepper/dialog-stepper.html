<h2 mat-dialog-title>{{ data.formTitle }}</h2>

<mat-dialog-content>
  <mat-horizontal-stepper linear>
    <mat-step *ngFor="let field of data.fields; let i = index" [stepControl]="stepForms[i]">
      <form [formGroup]="stepForms[i]">
        <ng-template matStepLabel>{{ field.placeholder }}</ng-template>

        <div [ngSwitch]="field.type">
          <!-- Text / Amount -->
          <mat-form-field *ngSwitchCase="'text'" appearance="fill" class="full-width">
            <mat-label>{{ field.placeholder }}</mat-label>
            <div style="height: 20px;"></div>
            <input matInput [formControlName]="field.name" />
          </mat-form-field>

          <!-- Number -->
          <mat-form-field *ngSwitchCase="'number'" appearance="fill" class="full-width">
            <mat-label>{{ field.placeholder }}</mat-label>
            <div style="height: 20px;"></div>
            <input matInput type="number" [formControlName]="field.name" />
          </mat-form-field>

    
         <mat-form-field *ngSwitchCase="'date'" appearance="fill" class="full-width">
            <mat-label>{{ field.placeholder }}</mat-label>
            <div style="height: 20px;"></div>
            <input matInput [matDatepicker]="picker" [formControlName]="field.name">
             <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>


          <!-- Select -->
          <mat-form-field *ngSwitchCase="'select'" appearance="fill" class="full-width">
            <mat-label>{{ field.placeholder }}</mat-label>
            <div style="height: 20px;"></div>
            <mat-select [formControlName]="field.name">
              <mat-option *ngFor="let opt of field.options" [value]="opt.value">
                {{ opt.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Stepper buttons -->
        <div class="step-buttons">
          <button mat-button matStepperPrevious *ngIf="i > 0">Rudi Nyuma</button>
          <button mat-button matStepperNext *ngIf="i < data.fields.length - 1"
            [disabled]="stepForms[i].invalid">Endelea Mbele</button>
          <button mat-raised-button color="primary" *ngIf="i === data.fields.length - 1"
            [disabled]="stepForms[i].invalid"
            (click)="onSubmit()">Submit</button>
        </div>
      </form>
    </mat-step>
  </mat-horizontal-stepper>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Ondoka</button>
</mat-dialog-actions>
