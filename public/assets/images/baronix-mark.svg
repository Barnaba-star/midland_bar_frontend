<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BaronixTZ">
  <!-- BaronixTZ: the bar's manager - a crowned figure with a headset, a bow tie
       and a chart badge: the one who takes the orders and keeps the books. -->
  <rect width="64" height="64" rx="14" fill="#f5a524"/>
  <g fill="#1a1206">
    <!-- Crown -->
    <path d="M22.5 15.5 21 8.5l5.2 3.6L32 6l5.8 6.1L43 8.5l-1.5 7z"/>
    <!-- Head -->
    <circle cx="32" cy="25" r="8.6"/>
    <!-- Shoulders -->
    <path d="M12 60c0-12.6 8.6-19.4 20-19.4S52 47.4 52 60z"/>
  </g>
  <!-- Headset: band over the head and a mic to the mouth -->
  <path d="M22.4 25.5a9.6 9.6 0 0 1 19.2 0" fill="none" stroke="#fff3d6" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="20.3" y="23.4" width="4.2" height="6.4" rx="2" fill="#fff3d6"/>
  <path d="M22.4 29.6c0 4.6 3.4 6.4 7.6 6.4" fill="none" stroke="#fff3d6" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="30.4" cy="36" r="1.6" fill="#fff3d6"/>
  <!-- Bow tie -->
  <path d="M26.5 44.5l5.5 2.6 5.5-2.6v5.4l-5.5-2.6-5.5 2.6z" fill="#f5a524"/>
  <!-- Chart badge -->
  <circle cx="49" cy="49" r="10" fill="#fff3d6" stroke="#1a1206" stroke-width="1.6"/>
  <g fill="#1a1206">
    <rect x="43.6" y="49.5" width="2.8" height="5" rx=".6"/>
    <rect x="47.6" y="46.5" width="2.8" height="8" rx=".6"/>
    <rect x="51.6" y="43.5" width="2.8" height="11" rx=".6"/>
  </g>
</svg>
