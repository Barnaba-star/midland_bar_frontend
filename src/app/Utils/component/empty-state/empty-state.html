<div class="empty-state" [class.compact]="compact">

  <div class="empty-state-icon">
    <mat-icon [svgIcon]="icon"></mat-icon>
  </div>

  <h3 class="empty-state-title">{{ title | translate }}</h3>

  @if (text) {
    <p class="empty-state-text">{{ text | translate }}</p>
  }

  <div class="empty-state-actions"><ng-content></ng-content></div>

</div>
