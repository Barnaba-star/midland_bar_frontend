<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BaronixTZ">
  <!-- BaronixTZ: a face drawn in a few lines, the way an artist sketches a
       person - no head, no hair, just the face - under a small crown. -->
  <rect width="64" height="64" rx="14" fill="#f5a524"/>
  <!-- Crown, floating where the head would be -->
  <path d="M24.5 15.5 23 9.5l4.6 3.2L32 7.5l4.4 5.2L41 9.5l-1.5 6z" fill="#1a1206"/>
  <g fill="none" stroke="#1a1206" stroke-linecap="round" stroke-linejoin="round">
    <!-- Jaw: from one cheek round the chin to the other, open at the top -->
    <path d="M16.5 30c.4 11.6 7.2 21 15.5 21s15.1-9.4 15.5-21" stroke-width="3"/>
    <!-- Brows -->
    <path d="M21.5 27.5c1.8-1.6 4.6-1.9 7-.8" stroke-width="2.6"/>
    <path d="M35.5 26.7c2.4-1.1 5.2-.8 7 .8" stroke-width="2.6"/>
    <!-- Nose, one line -->
    <path d="M32.6 30.5c-.3 3.6-1.4 6.4-3.4 8 1.4.8 3.1.8 4.6.1" stroke-width="2.4"/>
    <!-- Smile -->
    <path d="M25.5 42.5c3.8 3.6 9.2 3.6 13 0" stroke-width="2.8"/>
  </g>
  <!-- Eyes -->
  <g fill="#1a1206">
    <ellipse cx="25.6" cy="32" rx="2.2" ry="2.6"/>
    <ellipse cx="38.4" cy="32" rx="2.2" ry="2.6"/>
  </g>
  <g fill="#fff3d6">
    <circle cx="26.3" cy="31.1" r=".8"/>
    <circle cx="39.1" cy="31.1" r=".8"/>
  </g>
</svg>
